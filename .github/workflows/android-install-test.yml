name: Android install test

# 올려 둔 APK를 에뮬레이터에 실제로 설치해 보고 오류 메시지를 확인 (수동 실행)
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: "안드로이드 API 레벨 (34 = 안드로이드 14, 36 = 안드로이드 16)"
        default: "36"

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: APK 받기
        run: curl -fL -o meal-log.apk https://github.com/kangsogo7/meal-log/releases/download/android/meal-log.apk

      - name: APK 정보
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump badging meal-log.apk | head -20 || true
          "$AAPT" dump xmltree meal-log.apk --file AndroidManifest.xml | grep -iE "activity|alias|permission|targetActivity|exported" | head -80 || true

      - name: KVM 사용 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에 설치
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api-level }}
          target: google_apis
          arch: x86_64
          script: |
            adb shell getprop ro.build.version.release
            adb install -r meal-log.apk 2>&1 || true
            adb shell pm list packages | grep meallog || echo "NOT INSTALLED"
            adb logcat -d | grep -iE "PackageManager|PackageInstaller|INSTALL_|meallog|Failure" | grep -v "Instant App" | tail -60 || true
