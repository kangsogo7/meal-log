name: Deploy Firebase rules + functions

# firestore.rules(그룹 데이터 접근 규칙)와 functions/(AI 호출 서버)를 배포.
# 저장소 Secrets의 FIREBASE_SERVICE_ACCOUNT(서비스 계정 키 JSON)로 로그인함.
# AI 서버에는 Secret Manager의 GEMINI_API_KEY가 있어야 함 (없으면 함수 배포만 실패하고 규칙은 배포됨).
# 2026-11-17: 출시 전이라 Blaze 요금제를 되돌리고 AI 서버를 지움. 서비스 계정 권한도 없어서 자동 실행은 끄고 수동으로만.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 서비스 계정 키 준비
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: 접근 규칙 배포
        run: npx --yes firebase-tools@15 deploy --only firestore:rules --project meal-log-f1b13 --non-interactive
      - name: AI 호출 서버 배포
        run: |
          npm ci --prefix functions
          npx --yes firebase-tools@15 deploy --only functions --project meal-log-f1b13 --non-interactive --force
      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
